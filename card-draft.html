<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <title>심소현 | 디지털 명함</title>

  <style>
    :root{--ink:#262b2e;--muted:#6b7276;--line:#e8ebeb;--accent:#167d7c}
    *{box-sizing:border-box}
    body{margin:0;background:#f4f5f5;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;letter-spacing:-.025em}
    a{color:inherit;text-decoration:none}
    .page{min-height:100svh;display:grid;place-items:center;padding:36px 16px}
    .card{width:min(100%,420px);overflow:hidden;background:#fff;border:1px solid #e8eaea;border-radius:18px;box-shadow:0 18px 48px rgba(32,41,43,.07)}
    .profile-top{height:445px;position:relative;background:#eae2dd url("assets/profile-card-extended.png") center -82px / cover no-repeat}
    .identity{position:absolute;left:20px;right:20px;bottom:18px;padding:17px 18px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.7);border-radius:10px}
    .body{padding:22px 28px 32px}
    .brand{margin:0 0 7px;color:var(--accent);font-size:13px;font-weight:800}
    h1{margin:0;font-size:31px;line-height:1.12;letter-spacing:-.06em}
    .role{margin:5px 0 0;color:var(--muted);font-size:14px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .actions a{min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid #ccd4d4;border-radius:8px;font-size:14px;font-weight:750}
    .actions a:first-child{background:var(--ink);border-color:var(--ink);color:#fff}
    .actions a:hover,.actions a:focus-visible{border-color:var(--accent);color:var(--accent)}
    .actions a:first-child:hover,.actions a:first-child:focus-visible{background:#3b4548;color:#fff}
    .links{margin-top:30px;border-top:1px solid var(--line)}
    .link{min-height:61px;display:grid;grid-template-columns:78px 1fr;align-items:center;gap:9px;border-bottom:1px solid var(--line);font-size:14px}
    .link:hover .value,.link:focus-visible .value{color:var(--accent)}
    .label{color:#8a9092;font-size:13px}.value{font-weight:650;overflow-wrap:anywhere}
    .specialty{margin-top:31px}.specialty h2{margin:0 0 5px;font-size:15px}.specialty p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
    .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
    .tags span{display:inline-flex;align-items:center;min-height:29px;padding:5px 10px;border:1px solid #e4e9e9;border-radius:999px;background:#f8fafa;color:#566064;font-size:12px;line-height:1.3}
    .brand-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}
    .brand-head h2,.brand-head h3{margin:0}
    .blog-button{flex:none;padding:5px 9px;border:1px solid #d9e0e0;border-radius:6px;color:var(--accent);font-size:12px;font-weight:750;white-space:nowrap}
    .blog-button:hover,.blog-button:focus-visible{border-color:var(--accent);background:#f3f9f9}
    .subbrand{margin-top:17px;padding-top:17px;border-top:1px solid var(--line)}
    .subbrand .relation{margin-bottom:5px;color:var(--accent);font-size:12px;font-weight:750}
    .subbrand h3{margin:0 0 5px;font-size:15px}
    @media(max-width:480px){.page{display:block;padding:0;background:#fff}.card{width:100%;min-height:100svh;border:0;border-radius:0;box-shadow:none}.profile-top{height:106vw;max-height:445px;background-position:center -19vw}.body{padding:22px 24px 34px}}
    @media(max-width:350px){.identity{left:14px;right:14px;padding:14px}.brand{font-size:12px}h1{font-size:29px}.role{font-size:13px}}
  </style>
</head>
